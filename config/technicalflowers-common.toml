
#Conversion ratio between Botania mana and liquid mana.
[conversion]
	#Botania mana points on the left side of the ratio.
	#Example: mana_units=100 and fluid_units=1 means 100 mana = 1 mB.
	#Range: 1 ~ 1000000
	mana_units = 1
	#Liquid mana millibuckets on the right side of the ratio.
	#The default values produce a 1:1 conversion.
	#Transfers use complete ratio batches so conversion is lossless.
	#Range: 1 ~ 1000000
	fluid_units = 1

